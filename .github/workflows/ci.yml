name: ci

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-test-release-assets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: pwsh
            runtimes: win-x64,win-arm64
          - os: ubuntu-latest
            shell: bash
            runtimes: linux-x64 linux-arm64
          - os: macos-latest
            shell: bash
            runtimes: osx-x64 osx-arm64
    runs-on: ${{ matrix.os }}
    env:
      APP_NAME: PublicVideoLauncher
      APP_VERSION: 1.0.0

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PublicVideoLauncher.csproj

      - name: Test
        run: dotnet test tests/PublicVideoLauncher.Tests/PublicVideoLauncher.Tests.csproj -c Release --no-restore

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe") -and -not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            winget install --id JRSoftware.InnoSetup -e -s winget --accept-package-agreements --accept-source-agreements --silent --disable-interactivity
          }

      - name: Build release assets (Windows)
        if: matrix.shell == 'pwsh'
    shell: pwsh
        run: |
          .\build\release.ps1 -SelfContained -SkipSourceArchive -Version $env:APP_VERSION -Runtimes ($env:RUNTIMES -split ',')
        env:
          RUNTIMES: ${{ matrix.runtimes }}

      - name: Build release assets (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x build/*.sh build/assets/*.sh
          CREATE_SOURCE_ARCHIVE=true \
          CREATE_LINUX_NATIVE_PACKAGES=true \
          VERSION="$APP_VERSION" \
          SELF_CONTAINED=true \
          ./build/release.sh $RUNTIMES
        env:
          RUNTIMES: ${{ matrix.runtimes }}

      - name: Build release assets (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x build/*.sh build/assets/*.sh
          CREATE_SOURCE_ARCHIVE=false \
          CREATE_MACOS_APP_BUNDLES=true \
          SIGN_MACOS_APP=false \
          VERSION="$APP_VERSION" \
          SELF_CONTAINED=true \
          ./build/release.sh $RUNTIMES
        env:
          RUNTIMES: ${{ matrix.runtimes }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-${{ runner.os }}-releases
          path: |
            artifacts/releases
            artifacts/SHA256SUMS.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload source artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-source
          path: |
            artifacts/source
          if-no-files-found: ignore
          retention-days: 14